<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario Tarea 2</title>
    <link rel="stylesheet" href="tarea2.css">
</head>

<body>

    <form>
        <fieldset>
            <legend>Datos personales</legend>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos">
        </fieldset>
    </form>

    <form>
        <fieldset>
            <legend>Dirección postal</legend>
            <label for="dirección">Dirección</label>
            <input type="text" id="dirección" name="dirección">
            <label for="población">Población</label>
            <input type="text" id="población" name="población">
            <label for="postal">Código postal</label>
            <input type="text" id="postal" name="postal">
        </fieldset>
    </form>

    <form>
        <fieldset>
            <legend>Datos de contacto</legend>
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
            <label for="telf">Teléfono</label>
            <input type="text" id="telf" name="telf">
        </fieldset>
    </form>

    <input type="submit" class="boton" value="ENVIAR">
    

</body>

</html>
